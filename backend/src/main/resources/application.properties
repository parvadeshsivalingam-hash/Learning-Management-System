server.port=8080

# =========================================================
# MySQL Database Configuration
# Replace YOUR_MYSQL_USERNAME and YOUR_MYSQL_PASSWORD with your actual credentials.
# Make sure the 'lms_db' database exists in MySQL before running.
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# JWT Security Configuration
# =========================================================
jwt.secret=9a2f8c4e7b1d3a5f6e8c0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0e2f
jwt.expiration=86400000
